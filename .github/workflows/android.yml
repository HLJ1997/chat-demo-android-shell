name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出壳工程
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 从我们的前端 fork 构建并同步 assets
        run: bash scripts/sync-frontend.sh
        env:
          FRONTEND_REPO: https://github.com/HLJ1997/chat-demo.git
          FRONTEND_REF: main

      # 前端产物是提交进仓库的；这里校验同步结果与提交内容一致，
      # 防止「改了前端但忘了把 dist 同步进来」这种漂移。
      - name: 校验 assets 与提交内容一致
        run: |
          if [ -n "$(git status --porcelain app/src/main/assets/www)" ]; then
            echo "::warning::assets/www 与前端构建结果不一致（请本地运行 scripts/sync-frontend.sh 后提交）"
            git status --porcelain app/src/main/assets/www | head -20
          else
            echo "assets/www 与构建结果一致"
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub runner 每次都会新生成 debug keystore，导致不同次构建的签名证书不同，
      # 用户无法覆盖安装（必须卸载重装）。配置 DEBUG_KEYSTORE_BASE64 后复用同一个 keystore。
      # 注意：secrets 上下文不能用在 if 里，先映射到 env 再判断。
      - name: 恢复固定的 debug keystore（可选）
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/debug.keystore"
          echo "keystore 字节数: $(wc -c < "$RUNNER_TEMP/keystore/debug.keystore")"
          # 同时放一份到 AGP 的默认位置（双保险）
          cp "$RUNNER_TEMP/keystore/debug.keystore" "$HOME/.android/debug.keystore" 2>/dev/null || {
            mkdir -p "$HOME/.android"
            cp "$RUNNER_TEMP/keystore/debug.keystore" "$HOME/.android/debug.keystore"
          }

      # 版本号：tag 构建取 tag 名，其它构建用短 sha；versionCode 用时间戳保证单调递增
      - name: 解析版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: 构建 debug APK
        env:
          # local.properties 不入库，CI 用 SDK 自带路径
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          # 配置了固定 keystore 时，用 AGP 的注入签名属性显式指定，避免依赖默认路径解析
          INJ_STORE_FILE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' && format('{0}/keystore/debug.keystore', runner.temp) || '' }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          VERSION_ARGS="-PappVersionName=${APP_VERSION_NAME} -PappVersionCode=${APP_VERSION_CODE}"
          echo "版本: ${APP_VERSION_NAME} (${APP_VERSION_CODE})"
          if [ -n "$INJ_STORE_FILE" ] && [ -f "$INJ_STORE_FILE" ]; then
            echo "使用注入签名: $INJ_STORE_FILE"
            gradle --no-daemon --console=plain assembleDebug $VERSION_ARGS \
              -Pandroid.injected.signing.store.file="$INJ_STORE_FILE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            echo "未配置固定 keystore，使用默认签名"
            gradle --no-daemon --console=plain assembleDebug $VERSION_ARGS
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
